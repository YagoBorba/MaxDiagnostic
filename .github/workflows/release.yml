name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the demo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.2'

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build the demo APK
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release --dart-define=DEMO_MODE=true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="MaxDiagnostic-${version}-demo.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          notes=$(awk -v v="$version" '$0 ~ "^## \[?"v"\]?" {p=1; next} /^## / {p=0} p' CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" \
              --title "MaxDiagnostic ${version}" \
              --notes "${notes:-MaxDiagnostic ${version}}"
          fi
